name: Check

on:
    push:
    pull_request:
    # For the pull requests a workflow opens, which GitHub does not check on its own.
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - name: Install frozen dependencies
              run: npm ci
            # A tree pinned to a schema candidate cannot be released, so the release inputs cannot
            # hold on it: it is checked as a candidate. The release workflow always runs `check`.
            - name: Check release identity and project
              run: |
                  if node tools/assert-candidate-pins.mjs --detect; then
                    npm run check:candidate
                  else
                    npm run check
                  fi
